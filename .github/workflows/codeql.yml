# CodeQL static-analysis workflow.
#
# Why security-extended? The demo deliberately plants a DOM XSS
# (nameEl.innerHTML = playerName) so that Copilot Autofix can patch it live
# on stage. The security-extended suite includes js/xss-through-dom; the
# default suite does not. This workflow is what catches the bug.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly scan on Monday at 06:17 UTC — staggered to avoid GitHub's
    # top-of-hour queue spike.
    - cron: "17 6 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Initialize the CodeQL database. We point at the security-extended
      # query suite explicitly — do not change this to 'default'.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
          queries: security-extended

      # No compile step is needed for JavaScript/TypeScript — CodeQL extracts
      # directly from source. Autobuild is included anyway so the workflow
      # structure is recognisable and easy to extend if a compile step is ever
      # added (e.g. a Node.js native module).
      - name: Autobuild
        uses: github/codeql-action/autobuild@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
        with:
          category: "/language:javascript-typescript"
