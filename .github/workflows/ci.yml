# Runs on every PR and every push to main.
# Goal: catch type errors, lint violations, test failures, and broken builds
# before they ever land on main — fast feedback for the AI-native SDLC demo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege: we only need to read the source.
permissions:
  contents: read

# One run per ref at a time; cancel the older run when a new push arrives.
# This keeps the queue short without wasting minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static analysis before running anything — fail fast on obvious mistakes.
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # Playwright needs browser binaries that aren't in the runner image.
      # --with-deps pulls the OS-level shared libraries too (ffmpeg, etc.).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      # Confirm the production artefact builds cleanly on every PR.
      # A build that passes tests but fails to bundle is still broken.
      - name: Build
        run: npm run build

      # Playwright's HTML report is only worth keeping when something failed.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
