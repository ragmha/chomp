# OpenSSF Scorecard — measures supply-chain health and publishes results to
# the code scanning dashboard so the security posture is visible in the repo.
# Runs weekly and on every push to main.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly on Sunday at 05:43 UTC — staggered to avoid queue spikes.
    - cron: "43 5 * * 0"

# Scorecard's own workflow-verification refuses to publish if elevated
# permissions are granted globally — the top level must stay read-only and
# every write must be scoped to the job that needs it. Which is exactly the
# least-privilege principle the tool is measuring, so it is worth obeying
# rather than working around.
permissions:
  contents: read

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # needed to publish Scorecard results
      security-events: write # needed to upload SARIF to code scanning

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publish results to the public Scorecard API so the badge works.
          publish_results: true

      # Upload SARIF so findings appear in the Security > Code scanning tab
      # alongside CodeQL alerts — one place for all security signal.
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
