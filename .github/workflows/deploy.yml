# Builds the game, attests the artefact, and ships it to GitHub Pages.
#
# Two-job design: `build` produces a signed provenance attestation so anyone
# can verify the bytes on Pages came from this exact commit. `deploy` sits
# behind the `production` environment, which carries a required reviewer —
# that reviewer gate is the human-in-the-loop that stops the AI agent from
# shipping unilaterally. This is a key beat in the AI-native SDLC demo.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default to read-only; each job narrows to only what it needs.
permissions:
  contents: read

jobs:
  build:
    name: Build & attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # needed to mint the OIDC token for attestation
      attestations: write  # needed to write the attestation to the repo

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # CHOMP_BASE sets Vite's base path for the project Pages URL. It is set
        # only here, so local dev and CI test runs keep serving from root.
        run: npm run build
        env:
          CHOMP_BASE: /chomp/

      # Publish a signed SLSA provenance attestation for the dist/ directory.
      # Anyone can verify: `gh attestation verify dist/ --repo ragmha/chomp`
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/**

      # Package dist/ as a Pages artefact so the deploy job can pick it up.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest

    # The `production` environment is configured in GitHub with a required
    # reviewer. That reviewer check is the human approval gate — the workflow
    # pauses here until a person clicks Approve. This is what prevents the
    # AI agent from shipping directly to production without human sign-off.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.page_url }}

    permissions:
      pages: write     # needed to push to GitHub Pages
      id-token: write  # needed to verify the deployment token

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
