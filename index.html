<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      secure-web-app rule 4. Note there is no 'unsafe-inline' anywhere: all
      script and style is served as its own file from this origin, which is
      what makes the build attestation meaningful.

      frame-ancestors is declared for completeness but browsers only honour it
      in a real response header, not in a meta tag. On Pages we cannot set
      headers, so clickjacking protection here is best-effort.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    />

    <title>CHOMP</title>
    <meta name="description" content="A maze-chase arcade game, built as a working demo of an AI-native SDLC on GitHub." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23ffd23f'/></svg>" />
  </head>

  <body>
    <main class="shell">
      <header class="hud">
        <p class="hud__item"><span class="hud__label">Score</span><span id="score" class="hud__value">0</span></p>
        <p class="hud__item"><span class="hud__label">Best</span><span id="best" class="hud__value">0</span></p>
        <p class="hud__item"><span class="hud__label">Level</span><span id="level" class="hud__value">1</span></p>
        <p class="hud__item"><span class="hud__label">Lives</span><span id="lives" class="hud__value">3</span></p>
      </header>

      <!--
        a11y-arcade rule 5: the board is not a silent void. The label is kept
        current with game state by src/a11y/announcer.ts.
      -->
      <canvas
        id="board"
        width="448"
        height="496"
        role="img"
        aria-label="CHOMP maze. Game not started."
      ></canvas>

      <!-- a11y-arcade rule 4: throttled to at most one announcement a second. -->
      <div id="announcer" class="visually-hidden" aria-live="polite" role="status"></div>

      <section id="overlay" class="overlay">
        <h1 class="overlay__title">CHOMP</h1>
        <p class="overlay__body">Arrows or WASD to move. <kbd>P</kbd> or <kbd>Esc</kbd> to pause.</p>
        <button id="start" class="button" type="button">Start game</button>
      </section>

      <footer class="footer">
        <p>
          An original maze-chase game, and a working demo of an AI-native SDLC.
          <a href="https://github.com/ragmha/chomp">Read how it was built</a>.
        </p>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
